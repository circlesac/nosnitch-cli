name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: bump
        run: |
          VERSION=$(npx --yes @circlesac/oneup version --target version.go | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: versioned-files
          path: version.go

  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            name: nosnitch-darwin-arm64
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            name: nosnitch-darwin-amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            name: nosnitch-linux-arm64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            name: nosnitch-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: versioned-files

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w" -o nosnitch .
          tar czf ${{ matrix.name }}.tar.gz nosnitch

      - name: Package Debian artifact
        if: matrix.goos == 'linux'
        run: ./packaging/build-deb.sh nosnitch ${{ needs.version.outputs.version }} ${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            nosnitch_*.deb

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
            bin/install.sh

  publish-homebrew:
    needs: [version, release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${{ needs.version.outputs.version }}
          SHA_DARWIN_ARM64=$(shasum -a 256 artifacts/nosnitch-darwin-arm64/*.tar.gz | cut -d' ' -f1)
          SHA_DARWIN_AMD64=$(shasum -a 256 artifacts/nosnitch-darwin-amd64/*.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(shasum -a 256 artifacts/nosnitch-linux-arm64/*.tar.gz | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(shasum -a 256 artifacts/nosnitch-linux-amd64/*.tar.gz | cut -d' ' -f1)

          git clone https://x-access-token:${GH_TOKEN}@github.com/circlesac/homebrew-tap.git
          cd homebrew-tap
          cp ../homebrew/nosnitch.rb.template Formula/nosnitch.rb
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/nosnitch.rb
          sed -i "s/SHA_DARWIN_ARM64/${SHA_DARWIN_ARM64}/g" Formula/nosnitch.rb
          sed -i "s/SHA_DARWIN_AMD64/${SHA_DARWIN_AMD64}/g" Formula/nosnitch.rb
          sed -i "s/SHA_LINUX_ARM64/${SHA_LINUX_ARM64}/g" Formula/nosnitch.rb
          sed -i "s/SHA_LINUX_AMD64/${SHA_LINUX_AMD64}/g" Formula/nosnitch.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/nosnitch.rb
          git commit -m "Update nosnitch to ${VERSION}"
          git push

  publish-apt:
    needs: [version, release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Configure APT repository deploy key
        env:
          APT_REPO_DEPLOY_KEY: ${{ secrets.APT_REPO_DEPLOY_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$APT_REPO_DEPLOY_KEY" > ~/.ssh/circlesac-apt
          chmod 0600 ~/.ssh/circlesac-apt
          curl -fsSL https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com \(.)"' > ~/.ssh/known_hosts
          printf '%s\n' \
            'Host github.com' \
            '  IdentityFile ~/.ssh/circlesac-apt' \
            '  IdentitiesOnly yes' > ~/.ssh/config

      - name: Publish Debian packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git clone git@github.com:circlesac/apt.git
          install -d -m 0755 apt/incoming/nosnitch
          cp artifacts/nosnitch-linux-*/*.deb apt/incoming/nosnitch/
          cd apt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add incoming/nosnitch
          git commit -m "Update nosnitch to ${VERSION}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
          done
          exit 1
